name: CI

# Root workflow for this repo. app/.github/workflows/ is upstream Kurn's and is
# never run by GitHub (it also needs their secrets). No job here uses secrets.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  kurncore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift --version
      - name: swift test
        working-directory: app/Packages/KurnCore
        run: swift test

  app-tests:
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image defaults to Xcode 27.1; match the local 27.2. Booting first avoids
      # xcodebuild timing out on the simulator's lockdown service (hung a run on 2026-11-27).
      - name: Select Xcode and boot simulator
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
          xcrun simctl boot 'iPad mini (A20 Pro)' || true
          # bootstatus itself crashed (NSException) on a runner once; one retry.
          xcrun simctl bootstatus 'iPad mini (A20 Pro)' -b || { sleep 15; xcrun simctl bootstatus 'iPad mini (A20 Pro)' -b; }
      # Package sources only (not build products), keyed on what pins them; same idea
      # as upstream's app/.github/actions/cache-spm-packages.
      # hashFiles() timed out (120 s) twice on this runner, so hash the three files in shell.
      - name: SwiftPM cache key
        id: spmkey
        run: echo "hash=$(cat Kurn.xcodeproj/project.pbxproj Kurn.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved Packages/WhisperCpp/Package.swift | shasum -a 256 | cut -c1-40)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ steps.spmkey.outputs.hash }}
      - name: KurnTests
        run: |
          xcodebuild \
            -project Kurn.xcodeproj \
            -scheme Kurn \
            -destination 'platform=iOS Simulator,name=iPad mini (A20 Pro),OS=27.2' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/KurnTests.xcresult" \
            -only-testing:KurnTests \
            test
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KurnTests-xcresult
          path: ${{ runner.temp }}/KurnTests.xcresult
